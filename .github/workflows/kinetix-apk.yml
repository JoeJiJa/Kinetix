name: Build Kinetix APK
on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'
      - name: Build Debug APK
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon
          cp app/build/outputs/apk/debug/app-debug.apk Kinetix-v1.0.0.apk
      - name: Upload Kinetix APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Kinetix-Debug-APK
          path: Kinetix-v1.0.0.apk
      - name: Publish to GitHub Releases
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          name: Kinetix v1.0.0 - Glassmorphic Video Player
          body: |
            ### Kinetix Local Video Player (v1.0.0)
            - **Glassmorphic UI**: Translucent HUD capsules, specular borders, and bouncy spring physics.
            - **Gesture Engine**: Long-press + horizontal swipe dynamic playback speed control with precision settings.
            - **Online Subtitles**: Direct in-player subtitle search and auto-attachment.
          files: Kinetix-v1.0.0.apk
