name: Build Kinetix APK

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: Build Debug APK
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon
          APK_PATH=$(find app/build/outputs/apk -name "*-debug.apk" | head -n 1)
          echo "Found APK: $APK_PATH"
          cp "$APK_PATH" Kinetix-v1.0.0.apk

      - name: Upload Kinetix APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Kinetix-Debug-APK
          path: Kinetix-v1.0.0.apk

      - name: Publish to GitHub Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.0
          name: Kinetix v1.0.0 - Glassmorphic Video Player
          files: Kinetix-v1.0.0.apk
